<div class="deactivate-user-page">
  <div class="deactivate-user-container">

    <div class="header">
      <h2>Desactivar usuario</h2>
      <p class="subtitle">Esta acción es irreversible</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">

      @if (success) {
        <div class="success-message">
          {{ success }}
        </div>
      }

      @if (error) {
        <div class="error-message">
          {{ error }}
        </div>
      }

      <div class="form-group">
        <label>ID del usuario</label>
        <input 
          type="text" 
          formControlName="userId"
          placeholder="UUID del usuario"
        />
      </div>

      <button type="submit" class="danger-btn" [disabled]="loading">
        @if (!loading) {
          Desactivar usuario
        } @else {
          Desactivando...
        }
      </button>

    </form>

    @if (confirm) {
      <div class="confirm-overlay">
        <div class="confirm-box">

          <h3>¿Confirmar desactivación?</h3>
          <p>El usuario será desactivado permanentemente.</p>

          <div class="confirm-actions">
            <button class="cancel" (click)="cancelConfirm()">
              Cancelar
            </button>

            <button class="confirm" (click)="confirmDeactivate()">
              Sí, desactivar
            </button>
          </div>

        </div>
      </div>
    }

  </div>
</div>
