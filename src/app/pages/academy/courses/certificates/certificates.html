<section class="certificates">

  <h3>Mis Certificados</h3>

  @if (!loading && certificates.length === 0) {
    <p>Aún no tienes certificados disponibles.</p>
  }

  @if (certificates.length > 0) {
    <div class="grid">
      @for (cert of certificates; track cert.courseId) {
        <div class="card">

          <h3>{{ cert.courseTitle }}</h3>

          <p class="date">
            Obtenido el {{ cert.issuedAt }}
          </p>

          <button (click)="openCertificate(cert.courseId)">
            Ver certificado
          </button>

        </div>
      }
    </div>
  }

</section>
