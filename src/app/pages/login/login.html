<div class="login-page">
  <div class="login-container">
    <h1>Intranet Lico Distribuciones</h1>
    <figure>
      <img src="assets/images/Logo.png" alt="Logo">
    </figure>
    <h2>Iniciar Sesión</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        @if (facade.errorMessage$ | async; as errorMessage) {
          <div class="error-message">{{ errorMessage }}</div>
        }
        <label for="email">Correo</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="Ingrese su correo" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Ingrese su contraseña" />
        <a (click)="openModal()">¿Olvidó su contraseña?</a>
      </div>

      <button type="submit">Ingresar</button>
    </form>
  </div>

  @if(showModal) {
    <div class="modal-backdrop">
      <div class="modal">
        <h2>Recuperar Contraseña</h2>
        <p>Por favor, comuníquese con <strong>TI</strong> para restablecer su contraseña.</p>
        <button class="btn-close" (click)="closeModal()">Cerrar</button>
      </div>
    </div>
  }
</div>
